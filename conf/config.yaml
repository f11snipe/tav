# Network port watching
network:
  ports:
    enabled: false
    # Ports that are always expected; anything else triggers an alert.
    # Leave empty to skip the unexpected-listener check.
    expected_listeners: [22, 80, 443]
    # CIDR ranges that are blocked as connection destinations
    blocked_destinations: []
    # Alert when specific processes open ports
    monitor_processes:
      - name: nc
        alert_on: any_listen
    poll_interval_ms: 5000

# DNS monitoring (passive: watches /etc/hosts for suspicious entries)
dns:
  enabled: false
  mode: passive
  alerts:
    - pattern: '.*\.onion$'
      severity: high
    - pattern: '[a-z0-9]{20,}\.(com|net|org)$'
      severity: medium

# Filesystem options
fs:
  # List of directories to walk & watch
  watch:
    - /tmp/watchme
    - ./tmp
  # Blacklist files (simple case insensitive regex)
  blacklist:
    - badfile.*
    - deleteme[0-9]+
    - dontletmelive
# Process options
ps:
  # Watch for processes (no action)
  watch:
    - sketchy
  # Blacklist processes (partial case insensitive compare)
  blacklist:
    - malwareps
    - killthisproc
  # Blacklist processes for specific users
  prohibit:
    # Don't allow www-data user to run sh or bash processes
    www-data:
      - /bin/sh
      - /bin/bash
